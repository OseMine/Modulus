name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: ./.github/actions/setup

      - name: Run rust checks
        uses: ./.github/actions/checks

      - name: Bundle VST3/CLAP
        uses: ./.github/actions/bundle

  release:
    name: Create GitHub release
    needs: rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine previous tag
        id: prevtag
        run: |
          echo "tag=$(git describe --tags --abbrev=0 ${GITHUB_REF_NAME}~1 2>/dev/null || echo '')" >> "$GITHUB_OUTPUT"

      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          pattern: modulus-bundles-*
          path: artifacts
          merge-multiple: false

      - name: Package bundles
        run: |
          for dir in artifacts/modulus-bundles-*; do
            os="${dir##*-}"
            case "$os" in
              Windows) archive="modulus-${{ github.ref_name }}-windows.zip"
                       (cd "$dir" && zip -qr "$OLDPWD/$archive" .) ;;
              macOS)   archive="modulus-${{ github.ref_name }}-macos.tar.gz"
                       tar -czf "$archive" -C "$dir" . ;;
              Linux)   archive="modulus-${{ github.ref_name }}-linux.tar.gz"
                       tar -czf "$archive" -C "$dir" . ;;
            esac
          done
          ls -la modulus-*

      - name: Generate release notes with OpenCode
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          PREV_TAG: ${{ steps.prevtag.outputs.tag }}
        run: |
          curl -fsSL https://opencode.ai/install | bash
          export PATH="$HOME/.opencode/bin:$PATH"
          if opencode run \
              "Write RELEASE_NOTES.md for the Modulus audio plugins release ${GITHUB_REF_NAME}. Use 'git log --oneline ${PREV_TAG}..HEAD' to summarize user-facing changes since ${PREV_TAG} (fall back to all history if empty). Include: highlights, new features (GUI editors, module engine, Lua patches, compiled module host if present), fixes, and an Installation section pointing at the release assets. Keep under 60 lines." \
              --model opencode/deepseek-v4-flash-free 2>/dev/null; then
            echo "OpenCode wrote RELEASE_NOTES.md"
            [ -s RELEASE_NOTES.md ] || git log --oneline "${PREV_TAG:-HEAD}..HEAD" > RELEASE_NOTES.md
          else
            echo "OpenCode unavailable; falling back to git log"
            git log --oneline "${PREV_TAG:-HEAD}..HEAD" > RELEASE_NOTES.md
          fi
          wc -l RELEASE_NOTES.md

      - name: Create GitHub release
        run: >
          gh release create "${{ github.ref_name }}"
          modulus-*.zip modulus-*.tar.gz
          --title "Modulus ${{ github.ref_name }}"
          --notes-file RELEASE_NOTES.md || true