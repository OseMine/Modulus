name: opencode-todo-issues

on:
  workflow_dispatch:
    inputs:
      focus:
        description: "Optional: nur diesen Abschnitt/Titel in todo.md verarbeiten (Teilstring)"
        required: false
        type: string
  schedule:
    - cron: "0 6 * * 3" # Mittwoch 06:00 UTC

# Guard gegen parallele Läufe, die duplizierte Issues erzeugen würden.
concurrency:
  group: opencode-todo-issues
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  create-issues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run opencode to create issues from todo.md
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/deepseek-v4-flash-free
          use_github_token: true
          prompt: |
            Aufgabe: Erzeuge GitHub-Issues aus den offenen Aufgaben in todo.md.

            Ablauf:
            1. Lies todo.md (und bei Bedarf reports/ für Kontext).
            2. Sammle alle offenen Aufgaben – erkennbar an „- [ ]"-Checkboxen –
               sowie die als „Tracking offene GitHub-Issues" notierten Punkte.
               Fokusbereich (optional): ${{ github.event.inputs.focus || 'alle offenen Punkte' }}
            3. Gruppiere zusammengehörige Punkte sinnvoll zu einem Issue
               (ein Issue pro logischem Task, nicht ein Issue pro Zeile).
            4. Rufe zuerst die bereits existierenden Issues per GitHub API ab
               ($GITHUB_TOKEN, REST: GET /repos/{owner}/{repo}/issues) und
               überspringe Punkte, für die bereits ein passendes Issue existiert
               (Titel-/Inhaltsabgleich).
            5. Erzeuge für jede Gruppe genau EIN GitHub-Issue (REST:
               POST /repos/{owner}/{repo}/issues) mit:
               - aussagekräftigem Titel (deutsch, kurz),
               - Body mit: Kontext, betroffene Dateien/Funktionen (mit
                 Zeilennummern aus todo.md), Akzeptanzkriterien und dem daraus
                 übernommenen todo.md-Text.
            6. Antworte am Ende mit einer Zusammenfassung der erstellten Issues
               (Nummer, Titel) und der übersprungenen Duplikate.

            WICHTIG:
            - Verändere KEINE Dateien, committe NICHTS und erstelle KEINEN Pull Request.