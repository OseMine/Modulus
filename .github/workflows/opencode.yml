name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Loop protection: only one opencode run per issue/PR at a time, and a hard
# timeout so a runaway session cannot hang or spawn duplicate PRs.
concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  # Rust/nih-plug specific job, stored as reusable actions (see
  # .github/actions/): formatting, clippy (-D warnings), full test suite.
  # Runs before the agent so OpenCode only sees a healthy tree.
  rust-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: ./.github/actions/setup

      - name: Run rust checks
        uses: ./.github/actions/checks

  opencode:
    if: |
      always() &&
      (contains(github.event.comment.body, '/oc') ||
       startsWith(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, '/opencode') ||
       startsWith(github.event.comment.body, '/opencode')) &&
      github.event.comment.user.type != 'Bot' &&
      github.event.comment.user.login != 'github-actions[bot]' &&
      github.event.comment.user.login != 'dependabot[bot]'
    needs: rust-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Require write access
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const { login, type } = context.payload.comment.user;
            if (type === 'Bot') {
              core.setFailed(`Bot account ${login} cannot trigger opencode`);
              return;
            }
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner,
                repo,
                username: login
              });
              if (!['admin', 'write'].includes(data.permission)) {
                core.setFailed(`${login} needs write access to trigger opencode (got: ${data.permission})`);
              } else {
                core.info(`${login} has ${data.permission} access - OK`);
              }
            } catch (err) {
              core.setFailed(`Could not verify permissions for ${login}: ${err.message}`);
            }

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/deepseek-v4-flash-free
          use_github_token: true
          prompt: |
            You are OpenCode working on this repository. A user with write
            access triggered you via a comment starting with `/oc` or
            `/opencode` on an issue or pull request. The task follows the
            command:

            ${{ github.event.comment.body }}

            Process:
            1. Read the task carefully and identify the affected files.
            2. If the task references todo.md or a GitHub issue, read the open
               items there first and work through the matching ones.
            3. Implement with small, focused edits that follow the existing
               code style (Rust workspace, nih-plug + egui).
            4. Verify your work: run `cargo fmt --all` and `cargo clippy
               --workspace --all-targets -- -D warnings` and fix any findings.
            5. Keep todo.md current: mark finished items with [x] and move them
               to archived-todo.md; document new findings in reports/.

            Rules:
            - Do not touch .github/workflows or .github/actions unless the
              comment explicitly asks for it.
            - Do not commit or push: the action commits your changes
              automatically.
            - End your reply with a short summary of what you changed.
