name: opencode-review

on:
  workflow_dispatch:
    inputs:
      focus:
        description: "Optional: Fokusbereich des Reviews (z. B. 'script.js Algorithmen')"
        required: false
        type: string
  schedule:
    - cron: "0 6 * * 1" # Montag 06:00 UTC

# Guard gegen parallele Läufe (Review-PRs kollidierten auf todo.md/reports).
concurrency:
  group: opencode-review
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run OpenCode review
        uses: anomalyco/opencode/github@latest
        env:
          # OpenCode Zen API-Key als Secret anlegen:
          # GitHub → Settings → Secrets and variables → Actions → OPENCODE_API_KEY
          # (Key unter https://opencode.ai/auth abrufen; Free-Modelle kosten nichts)
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/deepseek-v4-flash-free
          agent: reviewer
          use_github_token: true
          prompt: |
            Automatisiertes Code-Review des Modulus-Projekts (Rust-Workspace:
            Synthesizer-/FX-Plugins, nih-plug + egui, Modul-Engine).
            Fokusbereich: ${{ github.event.inputs.focus || 'das gesamte Projekt' }}

            Gehe vor wie im Reviewer-Agent beschrieben:
            1. Lies README.md, docs/*.md (ARCHITECTURE, PARAMETERS, MODULES,
               SETUPS), Cargo.toml, den Code unter crates/ (modulus-core,
               modulus-synth, modulus-fx, demo-module), die Workflows/Actions
               unter .github/ sowie die bestehende todo.md.
            2. Finde Bugs, fehlende Features und Verbesserungsvorschläge für
               die DSP-Funktionen (Filter, Oszillatoren, Chorus, Envelope),
               die Modul-/Setup-Engine und die CI. Verifiziere Verdachtsfälle,
               indem du Tests/Harnesses oder Probe-Setups ausführst.
            3. Lege reports/review-YYYY-MM-DD.md SOFRÜH WIE MÖGLICH an und fülle
               es während des Reviews schrittweise (Ordner bei Bedarf anlegen).
               Schreibe das Review nicht erst ganz am Ende.
            4. Hänge neue Befunde als datierten Abschnitt oben in todo.md an,
               bestehende Einträge unangetastet lassen.

            Zusätzliche Aufgaben (über den Reviewer-Agent hinaus):
            5. Prüfe, welche Punkte aus todo.md erledigt wurden, und markiere
               sie mit [x]; verifiziere vorhandene [x]-Markierungen und
               verschiebe danach alle abgehakten Todos nach archived-todo.md.
            6. Räume das Repository auf: ergänze offene Issues in todo.md,
               schließe erledigte Issues und lösche unnötige oder duplizierte
               Branches.
            7. Reviewe offene Pull Requests, behebe Merge-Konflikte und merge
               sie.

            WICHTIG: Committe NICHT, pushe NICHT und öffne KEINEN Pull Request
            selbst. Die GitHub-Action erkennt die geänderten Dateien automatisch,
            committed und pusht sie auf einen Branch und erstellt den Pull Request.
            Beende deine Antwort direkt nach Schritt 7 mit einer kurzen
            Zusammenfassung.

            Regeln:
            - Keinen Anwendungscode verändern, nur Berichte und todo.md.
            - Keine Findings ohne konkrete Datei-/Funktionsnamen.
            - Wenn keine neuen Befunde gefunden wurden, lege dennoch
              reports/review-YYYY-MM-DD.md an und dokumentiere das Ergebnis.