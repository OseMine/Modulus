name: Set up Rust toolchain
description: >-
  Installs the pinned Rust toolchain (1.97) with clippy and rustfmt, plus the
  shared cargo cache used by every rust job in this repo.

inputs:
  components:
    description: Additional toolchain components (comma separated).
    required: false
    default: "clippy,rustfmt"

runs:
  using: composite
  steps:
    - name: Install Linux GUI dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: >
        sudo apt-get update &&
        sudo apt-get install -y
        libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev
        libxcb1-dev libxcb-render0-dev libxcb-shape0-dev
        libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev
        libx11-dev libx11-xcb-dev

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@1.97
      with:
        components: ${{ inputs.components }}

    - name: Cache cargo registry and build output
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: . -> target