name: Build Windows installer
description: >-
  Builds a Windows installer (Inno Setup) from the VST3/CLAP bundles under
  target/bundled. Only meaningful on windows runners: the hosted steps are
  guarded by runner.os, so callers should additionally gate the action with
  `if: matrix.os == 'windows-latest'`.

runs:
  using: composite
  steps:
    - name: Install Inno Setup
      if: runner.os == 'Windows'
      shell: pwsh
      run: choco install innosetup -y --no-progress

    - name: Generate installer script
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $root = (Get-Location).Path
        $bundles = Join-Path $root 'target/bundled'
        if (-not (Test-Path $bundles)) {
          throw "no bundles found under $bundles -- run the bundle action first"
        }

        $match = Select-String -Path (Join-Path $root 'Cargo.toml') `
          -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
        $version = $match.Matches[0].Groups[1].Value
        Write-Host "workspace version: $version"

        $out = Join-Path $root 'target/installer'
        New-Item -ItemType Directory -Force -Path $out | Out-Null

        $lines = [System.Collections.Generic.List[string]]::new()
        $lines.Add('; generated by .github/actions/installer')
        $lines.Add('[Setup]')
        $lines.Add('AppName=Modulus')
        $lines.Add('AppVersion=' + $version)
        $lines.Add('AppPublisher=Modulus')
        $lines.Add('DefaultDirName={autopf64}\Modulus')
        $lines.Add('DisableProgramGroupPage=yes')
        $lines.Add('OutputDir=' + $out)
        $lines.Add('OutputBaseFilename=Modulus-Installer-' + $version)
        $lines.Add('Compression=lzma2/max')
        $lines.Add('SolidCompression=yes')
        $lines.Add('ArchitecturesAllowed=x64compatible')
        $lines.Add('ArchitecturesInstallIn64BitMode=x64compatible')
        $lines.Add('UninstallDisplayName=Modulus')
        $lines.Add('')
        $lines.Add('[Files]')

        $matches_any = $false
        Get-ChildItem -Directory $bundles | ForEach-Object {
          $name = $_.Name
          $path = Join-Path $_.FullName '*'
          if ($name.EndsWith('.vst3')) {
            $lines.Add('Source: "' + $path + '"; DestDir: "{commoncf64}\VST3\' + $name + '"; Flags: recursesubdirs createallsubdirs ignoreversion')
            $matches_any = $true
          } elseif ($name.EndsWith('.clap')) {
            $lines.Add('Source: "' + $path + '"; DestDir: "{commoncf64}\CLAP\' + $name + '"; Flags: recursesubdirs createallsubdirs ignoreversion')
            $matches_any = $true
          } else {
            $lines.Add('Source: "' + $path + '"; DestDir: "{app}\' + $name + '"; Flags: recursesubdirs createallsubdirs ignoreversion')
          }
        }
        if (-not $matches_any) {
          throw "no VST3/CLAP bundle directories found under $bundles"
        }

        $iss = Join-Path $out 'installer.iss'
        [System.IO.File]::WriteAllLines($iss, $lines)
        Write-Host "wrote installer script: $iss"

    - name: Compile installer (ISCC)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
        if (-not (Test-Path $iscc)) {
          $iscc = (Get-ChildItem 'C:\Program Files*\Inno Setup*\ISCC.exe' |
            Select-Object -First 1).FullName
        }
        if (-not $iscc) { throw 'ISCC.exe not found' }
        $iss = Join-Path (Get-Location).Path 'target/installer/installer.iss'
        & $iscc $iss /Qp
        if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

    - name: List installer
      if: runner.os == 'Windows'
      shell: pwsh
      run: Get-ChildItem 'target/installer/*.exe' | ForEach-Object { Write-Host $_.FullName }

    - name: Upload installer
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: modulus-installer-${{ runner.os }}
        path: target/installer/*.exe
        if-no-files-found: error
        retention-days: 14