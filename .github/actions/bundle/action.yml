name: Bundle plugins
description: >-
  Builds both plugins in release mode and creates VST3 + CLAP bundles under
  target/bundled, then uploads them as a workflow artifact.

inputs:
  artifact:
    description: Artifact name to upload under (unset disables upload).
    required: false
    default: modulus-bundles

runs:
  using: composite
  steps:
    - name: Build and bundle (xtask)
      shell: bash
      run: cargo run -p xtask --release bundle

    - name: List bundles
      shell: bash
      run: find target/bundled -type f | sort

    - name: Check bundles are non-empty
      shell: bash
      run: >
        test -n "$(find target/bundled -name '*.vst3' -type f)" &&
        test -n "$(find target/bundled -name '*.clap' -type f)" &&
        echo "bundles ok"

    - name: Upload bundles
      if: ${{ inputs.artifact != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact }}-${{ runner.os }}
        path: target/bundled
        if-no-files-found: error